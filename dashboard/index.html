<style>
/* ── Minimal reset ───────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── Design tokens · LIGHT (the bare :root is the complete light palette) ─── */
:root{
  color-scheme:light;
  --plane:#eef1f5; --surface:#ffffff; --surface-2:#f7f9fc; --chart:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e6e7ec; --axis:#c8cad2; --border:rgba(11,11,11,.10);
  --accent:#2a78d6;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a;   /* FOODS · HOUSEHOLD · HOBBIES */
  --growth:#0ca30c; --growth-ink:#006300; --decline:#d03b3b; --risk:#b45309;
  --pill-bg:#eef1f5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --radius:12px; --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* ── DARK — declared under BOTH scopes so the toggle wins either direction ── */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --plane:#0b0e13; --surface:#141922; --surface-2:#1a2029; --chart:#141922;
  --ink:#f4f6fb; --ink-2:#c3c2b7; --muted:#8b8f98;
  --grid:#242a33; --axis:#39414c; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --cat-1:#3987e5; --cat-2:#e2673a; --cat-3:#22b184;
  --growth:#22b455; --growth-ink:#3ecb6b; --decline:#e0524f; --risk:#d99a3a;
  --pill-bg:#1c232d;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0b0e13; --surface:#141922; --surface-2:#1a2029; --chart:#141922;
  --ink:#f4f6fb; --ink-2:#c3c2b7; --muted:#8b8f98;
  --grid:#242a33; --axis:#39414c; --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --cat-1:#3987e5; --cat-2:#e2673a; --cat-3:#22b184;
  --growth:#22b455; --growth-ink:#3ecb6b; --decline:#e0524f; --risk:#d99a3a;
  --pill-bg:#1c232d;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.45);
}

/* ── Base ──────────────────────────────────────────────────────────────── */
body{background:var(--plane);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}

/* ── Top bar ───────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:var(--plane);
  border-bottom:1px solid var(--border)}
.topbar .row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;
  align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:17px}
.brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.spacer{flex:1}
.badge{font-family:var(--mono);font-size:11px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
  padding:5px 11px;white-space:nowrap}
.badge b{color:var(--ink);font-weight:600}
.tgl{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.tgl:hover{color:var(--ink);border-color:var(--axis)}

/* ── Tabs ──────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;margin:22px 0 18px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:9px;color:var(--ink-2);font-weight:550;
  font-size:13.5px;border:1px solid transparent}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);
  border-color:var(--border);box-shadow:var(--shadow)}

/* ── Notice ────────────────────────────────────────────────────────────── */
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);
  border:1px solid var(--border);border-left:3px solid var(--risk);
  border-radius:10px;padding:11px 14px;margin-bottom:18px;font-size:12.5px;color:var(--ink-2)}
.notice b{color:var(--ink)}

/* ── Cards & grid ──────────────────────────────────────────────────────── */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:14.5px}
.card .lede{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;margin-bottom:14px}
.qmark{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}

/* ── KPI tiles ─────────────────────────────────────────────────────────── */
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 16px 14px;display:flex;flex-direction:column;gap:7px}
.kpi .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:27px;font-weight:680;letter-spacing:-.02em;line-height:1}
.kpi .delta{font-family:var(--mono);font-size:12.5px;font-weight:600;display:flex;
  align-items:center;gap:5px}
.up{color:var(--growth-ink)} .down{color:var(--decline)} .flat{color:var(--muted)}

/* ── Chart frame ───────────────────────────────────────────────────────── */
.chart{background:var(--chart);border-radius:8px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;
  font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.seg-toggle{display:flex;gap:3px}
.seg-toggle button{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:7px;
  color:var(--ink-2);border:1px solid var(--border);background:var(--surface)}
.seg-toggle button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Tables ────────────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:2px 8px;
  border-radius:999px;background:var(--pill-bg);letter-spacing:.03em}
.pill.High{color:#fff;background:var(--decline)}
.pill.Medium{color:var(--ink);background:color-mix(in srgb,var(--risk) 30%,var(--pill-bg))}
.pill.Low{color:var(--ink-2)}

/* ── Filters ───────────────────────────────────────────────────────────── */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.filters label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:140px}
select:focus-visible,button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat-row{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  color:var(--ink-2);margin:4px 0 14px}
.stat-row b{color:var(--ink);font-size:15px;font-weight:680}

/* ── Tooltip ───────────────────────────────────────────────────────────── */
#tip{position:fixed;pointer-events:none;z-index:60;opacity:0;transition:opacity .08s;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:240px}
#tip .t-h{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:3px}
#tip b{font-variant-numeric:tabular-nums}

.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.footer{margin-top:26px;font-family:var(--mono);font-size:11px;color:var(--muted);
  border-top:1px solid var(--border);padding-top:14px;display:flex;gap:16px;flex-wrap:wrap}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  tip.style.left=nx+"px";tip.style.top=ny+"px";}
function hideTip(){tip.style.opacity=0;}

/* ════════════════════════════════════════════════════════════════════════
   CHART TOOLKIT — inline SVG. One axis per chart, 2px lines, hover tooltips.
   ════════════════════════════════════════════════════════════════════════ */
const W=760,H=250,PAD={l:52,r:18,t:14,b:30};
const PX={x:(i,n)=>PAD.l+(n<=1?0:(W-PAD.l-PAD.r)*i/(n-1)),
          xb:(i,n)=>PAD.l+(W-PAD.l-PAD.r)*(i+.5)/n,
          y:(v,max)=>H-PAD.b-(H-PAD.t-PAD.b)*(max?v/max:0)};

function yGrid(svg,max,fmtY){
  const ticks=4;
  for(let i=0;i<=ticks;i++){const v=max*i/ticks,y=PX.y(v,max);
    svg.append(s("line",{x1:PAD.l,x2:W-PAD.r,y1:y,y2:y,stroke:"var(--grid)","stroke-width":1}));
    txt(svg,{x:PAD.l-8,y:y+3.5,"text-anchor":"end",fill:"var(--muted)",
      "font-size":10.5,"font-family":"var(--mono)"},fmtY(v));}
}
function xLabels(svg,labels){
  const n=labels.length,step=Math.ceil(n/8);
  labels.forEach((l,i)=>{ const isLast=i===n-1;
    if(!isLast && (i%step!==0 || (n-1-i)<step)) return;   // keep ticks off the forced last
    const anchor=i===0?"start":isLast?"end":"middle";
    txt(svg,{x:PX.x(i,n),y:H-10,"text-anchor":anchor,fill:"var(--muted)",
      "font-size":10.5,"font-family":"var(--mono)"},l);});
}
function frame(){const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  svg.append(s("line",{x1:PAD.l,x2:W-PAD.r,y1:H-PAD.b,y2:H-PAD.b,stroke:"var(--axis)","stroke-width":1}));return svg;}

// Multi-series line chart (single y-axis). series:[{name,color,values}]
function lineChart(labels,series,fmtY){
  const svg=frame();
  const max=Math.max(1,...series.flatMap(se=>se.values))*1.08;
  yGrid(svg,max,fmtY); xLabels(svg,labels);
  series.forEach(se=>{
    const col=cssVar(se.color);
    const pts=se.values.map((v,i)=>[PX.x(i,labels.length),PX.y(v,max)]);
    svg.append(s("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",
      stroke:col,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    const last=pts[pts.length-1];
    svg.append(s("circle",{cx:last[0],cy:last[1],r:4,fill:col,stroke:"var(--chart)","stroke-width":2}));
  });
  // hover crosshair
  const cross=s("line",{y1:PAD.t,y2:H-PAD.b,stroke:"var(--axis)","stroke-width":1,"stroke-dasharray":"3 3",opacity:0});
  svg.append(cross);
  const hit=s("rect",{x:PAD.l,y:PAD.t,width:W-PAD.l-PAD.r,height:H-PAD.t-PAD.b,fill:"transparent"});
  svg.append(hit);
  hit.addEventListener("mousemove",ev=>{
    const bb=svg.getBoundingClientRect(),sc=W/bb.width;
    const mx=(ev.clientX-bb.left)*sc;
    const i=Math.max(0,Math.min(labels.length-1,Math.round((mx-PAD.l)/((W-PAD.l-PAD.r)/(labels.length-1)))));
    cross.setAttribute("x1",PX.x(i,labels.length));cross.setAttribute("x2",PX.x(i,labels.length));cross.setAttribute("opacity",1);
    const rows=series.map(se=>`<div><span class="dot" style="display:inline-block;background:${cssVar(se.color)}"></span> ${se.name}: <b>${fmtY(se.values[i])}</b></div>`).join("");
    showTip(`<div class="t-h">${labels[i]}</div>${rows}`,ev.clientX,ev.clientY);
  });
  hit.addEventListener("mouseleave",()=>{cross.setAttribute("opacity",0);hideTip();});
  return wrapChart(svg);
}

// Diverging horizontal bars around zero. rows:[{label,value,color,note}]
function divergingBars(rows,fmtV){
  const rh=34,gap=10,top=8,w=W,h=top*2+rows.length*rh;
  const svg=s("svg",{viewBox:`0 0 ${w} ${h}`,role:"img"});
  const max=Math.max(...rows.map(r=>Math.abs(r.value)))||1;
  const midL=180,reserve=104,scale=(w-midL-reserve)/2/max,zero=midL+(w-midL-reserve)/2;
  svg.append(s("line",{x1:zero,x2:zero,y1:top,y2:h-top,stroke:"var(--axis)","stroke-width":1}));
  rows.forEach((r,i)=>{
    const y=top+i*rh, bw=Math.abs(r.value)*scale, x=r.value>=0?zero:zero-bw, col=cssVar(r.color);
    const bar=s("rect",{x,y:y+6,width:Math.max(bw,1.5),height:rh-12-gap+6,rx:3,fill:col});
    svg.append(bar);
    txt(svg,{x:midL-12,y:y+rh/2+1,"text-anchor":"end",fill:"var(--ink)",
      "font-size":12.5,"font-family":"var(--sans)","font-weight":600},r.label);
    const lab=s("text",{x:r.value>=0?x+bw+8:x-8,y:y+rh/2+1,"text-anchor":r.value>=0?"start":"end",
      fill:"var(--ink-2)","font-size":11.5,"font-family":"var(--mono)"});
    lab.textContent=fmtV(r.value); svg.append(lab);   // note moves to the tooltip
    bar.addEventListener("mousemove",ev=>showTip(`<div class="t-h">${r.label}</div><b>${fmtV(r.value)}</b>${r.note?" · "+r.note:""}`,ev.clientX,ev.clientY));
    bar.addEventListener("mouseleave",hideTip);
  });
  return wrapChart(svg);
}

// Simple vertical bars (seasonality). vals:[{label,value}]
function vBars(vals,color,fmtV){
  const svg=frame(); const n=vals.length, max=Math.max(...vals.map(v=>v.value))*1.12;
  yGrid(svg,max,fmtV);
  const bw=(W-PAD.l-PAD.r)/n*0.62;
  vals.forEach((v,i)=>{
    const x=PX.xb(i,n)-bw/2, y=PX.y(v.value,max), col=cssVar(color);
    const bar=s("rect",{x,y,width:bw,height:H-PAD.b-y,rx:3,fill:col});
    svg.append(bar);
    txt(svg,{x:PX.xb(i,n),y:H-10,"text-anchor":"middle",fill:"var(--muted)",
      "font-size":10.5,"font-family":"var(--mono)"},v.label);
    bar.addEventListener("mousemove",ev=>showTip(`<div class="t-h">${v.label}</div><b>${fmtV(v.value)}</b>`,ev.clientX,ev.clientY));
    bar.addEventListener("mouseleave",hideTip);
  });
  return wrapChart(svg);
}

// Scatter (price change vs demand growth). pts:[{x,y,label,color,r}]
function scatter(pts,xlab,ylab){
  const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const xmax=Math.max(.02,...xs.map(Math.abs)),ymax=Math.max(.02,...ys.map(Math.abs));
  const X=v=>PAD.l+(W-PAD.l-PAD.r)*(v+xmax)/(2*xmax), Y=v=>PAD.t+(H-PAD.t-PAD.b)*(ymax-v)/(2*ymax);
  svg.append(s("line",{x1:PAD.l,x2:W-PAD.r,y1:Y(0),y2:Y(0),stroke:"var(--axis)","stroke-width":1}));
  svg.append(s("line",{x1:X(0),x2:X(0),y1:PAD.t,y2:H-PAD.b,stroke:"var(--axis)","stroke-width":1}));
  txt(svg,{x:W-PAD.r,y:Y(0)-6,"text-anchor":"end",fill:"var(--muted)","font-size":10,"font-family":"var(--mono)"},xlab+" →");
  txt(svg,{x:X(0)+6,y:PAD.t+8,fill:"var(--muted)","font-size":10,"font-family":"var(--mono)"},"↑ "+ylab);
  pts.forEach(p=>{
    const c=s("circle",{cx:X(p.x),cy:Y(p.y),r:p.r||5,fill:cssVar(p.color),
      "fill-opacity":.82,stroke:"var(--chart)","stroke-width":1.5});
    svg.append(c);
    c.addEventListener("mousemove",ev=>showTip(`<div class="t-h">${p.label}</div>demand <b>${fmt.pct(p.y)}</b> · price <b>${fmt.pct(p.x)}</b>`,ev.clientX,ev.clientY));
    c.addEventListener("mouseleave",hideTip);
  });
  return wrapChart(svg);
}
function wrapChart(svg){return h("div",{class:"chart"},[svg]);}

   RENDER — one function per card. Add / remove cards freely.

function deltaEl(g){ if(g==null)return h("span",{class:"delta flat"},"—");
  const cls=g>0?"up":g<0?"down":"flat",arrow=g>0?"▲":g<0?"▼":"■";
  return h("span",{class:"delta "+cls},`${arrow} ${fmt.pct(g).replace("+","")} YoY`);}

function card(title,qmark,lede,body){

/* ── Diagnostics page ──────────────────────────────────────────────────── */
function diagPage(){
  const seg=DATA.diag.segments_monthly;
  const states=[...new Set(seg.map(r=>r.state_id))].sort();
  const wrap=h("div",{class:"grid",style:"gap:16px"});

  const fState=h("select"),fStore=h("select"),fCat=h("select");
  fState.append(h("option",{value:"",text:"All states"}),...states.map(s=>h("option",{value:s,text:s})));
  const cats=[...new Set(seg.map(r=>r.cat_id))].sort();
  fCat.append(h("option",{value:"",text:"All categories"}),...cats.map(c=>h("option",{value:c,text:c})));
  function fillStores(){const st=fState.value;
    const stores=[...new Set(seg.filter(r=>!st||r.state_id===st).map(r=>r.store_key))].sort();
    fStore.innerHTML="";fStore.append(h("option",{value:"",text:"All stores"}),...stores.map(s=>h("option",{value:s,text:s})));}
  fillStores();
  const filters=h("div",{class:"filters"},[
    h("label",{},["State",fState]),h("label",{},["Store",fStore]),h("label",{},["Category",fCat]),
  ]);

  const statRow=h("div",{class:"stat-row"});
  const trendHost=h("div"),priceHost=h("div");
  function redraw(){
    const st=fState.value,so=fStore.value,ca=fCat.value;
    const rows=seg.filter(r=>(!st||r.state_id===st)&&(!so||r.store_key===so)&&(!ca||r.cat_id===ca));
    const months=[...new Set(rows.map(r=>r.month))].sort();
    const units=months.map(m=>rows.filter(r=>r.month===m).reduce((a,r)=>a+r.units,0));
    const value=months.map(m=>rows.filter(r=>r.month===m).reduce((a,r)=>a+r.sales_value,0));
    const asp=months.map((m,i)=>{const u=units[i];return u?value[i]/u:0;});
    trendHost.innerHTML="";priceHost.innerHTML="";
    trendHost.append(lineChart(months,[{name:"Units",color:"var(--accent)",values:units}],fmt.int));
    priceHost.append(lineChart(months,[{name:"ASP",color:"var(--cat-2)",values:asp}],fmt.price));
    statRow.innerHTML="";
    statRow.append(
      h("div",{},[document.createTextNode("Est. sales value  "),h("b",{text:fmt.moneyShort(value.reduce((a,b)=>a+b,0))})]),
      h("div",{},[document.createTextNode("Units  "),h("b",{text:fmt.int(units.reduce((a,b)=>a+b,0))})]),
      h("div",{},[document.createTextNode("Latest ASP  "),h("b",{text:fmt.price(asp[asp.length-1]||0)})]),
    );
  }
  [fState,fStore,fCat].forEach(sel=>sel.onchange=()=>{if(sel===fState)fillStores();redraw();});
  redraw();

  const diagCard=h("div",{class:"card"},[
    h("div",{class:"card-head"},h("div",{},[h("span",{class:"qmark",text:"02  "}),
      h("h2",{text:"Segment diagnostics",style:"display:inline"}),
      h("div",{class:"lede",text:"Drill state → store → category. What is actually moving?"})])),
    filters,statRow,
    h("div",{class:"grid two",style:"grid-template-columns:1fr 1fr;gap:16px"},[
      h("div",{},[h("div",{class:"eyebrow",text:"Demand (units, monthly)",style:"margin-bottom:6px"}),trendHost]),
      h("div",{},[h("div",{class:"eyebrow",text:"Average selling price, monthly",style:"margin-bottom:6px"}),priceHost]),
    ]),
  ]);
  wrap.append(diagCard);

  // Seasonality + context (company-wide)
  const dow=DATA.diag.dow;
  const seasonCard=card("Seasonality — average units by weekday","",
    "Company-wide demand shape (Walmart week starts Saturday).",
    vBars(dow.labels.map((l,i)=>({label:l,value:dow.units[i]})),"var(--accent)",fmt.int));
  const ctx=h("div",{class:"grid two",style:"grid-template-columns:1fr 1fr;gap:16px"});
  const evTbl=h("table",{},[h("thead",{},h("tr",{},[h("th",{text:"Category"}),h("th",{class:"num",text:"Event-day lift"})])),
    h("tbody",{},DATA.diag.event_lift.map(e=>h("tr",{},[h("td",{text:e.cat}),h("td",{class:"num up",text:fmt.pctRaw(e.lift_pct)})])))]);
  const sf=DATA.diag.snap_foods;
  const snapBody=h("div",{},[
    h("div",{class:"stat-row"},[
      h("div",{},[document.createTextNode("Non-SNAP  "),h("b",{text:sf.non})]),
      h("div",{},[document.createTextNode("SNAP  "),h("b",{text:sf.snap})]),
      h("div",{},[document.createTextNode("Lift  "),h("b",{class:"up",text:fmt.pctRaw(sf.lift_pct)})]),
    ]),
    h("div",{class:"lede",text:"SNAP benefit days lift FOODS demand specifically."})]);
  ctx.append(card("Event-day lift, by category","","Average units on holiday/event days vs ordinary days.",h("div",{class:"tbl-wrap"},evTbl)),
             card("SNAP effect on FOODS","",null,snapBody));
  wrap.append(seasonCard,ctx);
  return wrap;
}

  if(m.mode==="sample")$("#notice").append(h("div",{class:"notice"},[
    h("div",{html:"⚠️"}),
    h("div",{html:"<b>Synthetic sample data.</b> Layout and mechanics are real; the numbers are a scaffold, not a business finding. Rebuild from real M5 (<span class='mono'>mode: real</span> → <span class='mono'>make all</span>) before presenting."})]));
  // footer
  const f=$("#footer");
  f.append(h("span",{text:`Generated ${m.generated||"—"} · ${m.basis||""}`}));
  CONFIG.links.forEach(([label,href])=>f.append(h("a",{href,style:"color:var(--accent);text-decoration:none",text:label})));
  // theme
  const saved=localStorage.getItem("rci-theme");
  if(saved)document.documentElement.setAttribute("data-theme",saved);
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const next=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);localStorage.setItem("rci-theme",next);
    selectTab($("#tabs [aria-selected='true']").dataset.id); // re-resolve SVG colours
  };
  const start=(location.hash||"").replace("#","");
  selectTab(RENDER[start]?start:CONFIG.pages[0].id);
}
boot();
</script>
</body>
</html>
